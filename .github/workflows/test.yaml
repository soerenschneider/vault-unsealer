---
name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5.6.0
        with:
          go-version-file: go.mod
      - name: build binary
        run: make build
      - name: run all tests
        run: make tests
