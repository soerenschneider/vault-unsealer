---
name: Create and publish a container

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  packages: write

env:
  GH_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # signing the image with cosign
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Log in to the gcr registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.GH_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for container
        id: gcr
        uses: docker/metadata-action@v5.10.0
        with:
          images: ${{ env.GH_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value={{ branch}}-{{date 'YYYYMMDDHHmmss'}}
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.gcr.outputs.tags }}
          labels: ${{ steps.gcr.outputs.labels }}

      - name: Sign container image
        env:
          IMAGE: ${{ env.GH_REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        # keyless: the identity of this workflow is certified via GitHub's OIDC token and logged in Rekor
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
